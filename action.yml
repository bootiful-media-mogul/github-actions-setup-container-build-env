name: 'Setup Container and Cloud Environment'
description: 'Authenticates to Google Cloud, builds and publishes a container image, then triggers the deployment pipeline'

branding:
  icon: 'package'
  color: 'blue'

inputs:

  gcloud_project:
    description: 'the google cloud project name'
    required: true

  gh_token:
    description: 'GitHub Access Token / PAT'
    required: true

  app_name:
    description: 'the name of the application to be deployed'
    required: true

  gcloud_sa_key:
    description: 'the service account key for google cloud'
    required: true

  dockerfile:
    description: 'path to the Dockerfile, relative to the workspace root'
    required: false
    default: '.github/workflows/Dockerfile'

  artifact_registry:
    description: 'the Artifact Registry repository to publish the image to'
    required: false
    default: 'mogul-artifact-registry'

  registry_host:
    description: 'the Artifact Registry host'
    required: false
    default: 'us-docker.pkg.dev'

outputs:

  image:
    description: 'the fully qualified image reference that was pushed'
    value: ${{ steps.build.outputs.image }}

runs:
  using: 'composite'
  steps:

    - shell: bash
      env:
        GCLOUD_PROJECT: ${{ inputs.gcloud_project }}
        GH_TOKEN: ${{ inputs.gh_token }}
        APP_NAME: ${{ inputs.app_name }}
        GCLOUD_SA_KEY: ${{ inputs.gcloud_sa_key }}
      run: |
        set -euo pipefail
        for v in GCLOUD_PROJECT GH_TOKEN APP_NAME GCLOUD_SA_KEY ; do
          if [ -z "${!v}" ]; then
            echo "::error::required input '$(echo "$v" | tr '[:upper:]' '[:lower:]')' is empty"
            exit 1
          fi
        done

    - uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ inputs.gcloud_sa_key }}'

    - uses: 'google-github-actions/setup-gcloud@v2'

    - shell: bash
      env:
        GCLOUD_PROJECT: ${{ inputs.gcloud_project }}
        REGISTRY_HOST: ${{ inputs.registry_host }}
      run: |
        set -euo pipefail
        gcloud config set project "$GCLOUD_PROJECT"
        gcloud --quiet auth configure-docker "$REGISTRY_HOST"

    - uses: docker/setup-buildx-action@v3

    - id: build
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        APP_NAME: ${{ inputs.app_name }}
        GCLOUD_PROJECT: ${{ inputs.gcloud_project }}
        REGISTRY_HOST: ${{ inputs.registry_host }}
        ARTIFACT_REGISTRY: ${{ inputs.artifact_registry }}
        DOCKERFILE: ${{ inputs.dockerfile }}
      run: |
        set -euo pipefail
        IMAGE_NAME="${REGISTRY_HOST}/${GCLOUD_PROJECT}/${ARTIFACT_REGISTRY}/${APP_NAME}:latest"
        docker buildx build . \
          -f "$DOCKERFILE" \
          -t "$IMAGE_NAME" \
          --build-arg "APP_NAME=${APP_NAME}" \
          --push
        echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
        echo "pushed ${IMAGE_NAME}"

    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail
        echo "Invoking the pipeline to have it deploy everything..."
        curl --fail-with-body --silent --show-error \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          --data '{"event_type": "update-event"}' \
          https://api.github.com/repos/bootiful-media-mogul/pipeline/dispatches
